<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Clipboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #header {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #link-btn {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      background: transparent;
      border: 1px solid #1e293b;
      border-radius: 4px;
      color: #475569;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    #link-btn:hover { border-color: #334155; color: #94a3b8; }
    #link-btn.linked { border-color: #166534; color: #4ade80; }

    #clips {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 960px;
    }

    .clip {
      display: flex;
      border: 1px solid #1e293b;
      border-radius: 6px;
      background: #141820;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .clip:hover { border-color: #334155; }

    .clip-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .clip-title {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.02em;
      padding: 10px 12px 8px;
      background: transparent;
      border: none;
      border-bottom: 1px solid #1e293b;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    .clip-title:focus { color: #f8fafc; border-bottom-color: #334155; }
    .clip-title::placeholder { color: #334155; font-weight: 400; }

    /* Overlay editor: highlight div behind transparent textarea */
    .clip-editor {
      position: relative;
    }

    .clip-highlight {
      position: absolute;
      inset: 0;
      padding: 4px 12px 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      pointer-events: none;
      overflow: hidden;
      aria-hidden: true;
    }

    .clip-text {
      position: relative;
      display: block;
      width: 100%;
      padding: 4px 12px 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      background: transparent;
      color: transparent;
      caret-color: #94a3b8;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      min-height: 34px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .clip-text::placeholder { color: #334155; }

    /* Bash highlight colors */
    .h-cmd     { color: #38bdf8; } /* command name   – sky     */
    .h-key     { color: #e879f9; } /* keyword        – fuchsia */
    .h-flag    { color: #60a5fa; } /* flag -x/--opt  – blue    */
    .h-str     { color: #4ade80; } /* string         – green   */
    .h-var     { color: #f59e0b; } /* $variable      – amber   */
    .h-op      { color: #c084fc; } /* pipe/redir     – violet  */
    .h-num     { color: #fb923c; } /* number         – orange  */
    .h-cmt     { color: #475569; } /* comment        – slate   */
    .h-plain   { color: #cbd5e1; } /* plain text               */

    .clip-copy {
      width: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-right: 1px solid #1e293b;
      color: #334155;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .clip-copy:hover { background: #1e293b; color: #94a3b8; }
    .clip-copy.copied { background: #14532d; color: #4ade80; }
    .clip-copy svg { pointer-events: none; }

    .clip-delete {
      width: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1e293b;
      transition: color 0.12s;
      user-select: none;
    }
    .clip:hover .clip-delete { color: #334155; }
    .clip-delete:hover { color: #ef4444 !important; }

    #add-btn {
      margin-top: 8px;
      width: 100%;
      max-width: 960px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #1e293b;
      border-radius: 6px;
      cursor: pointer;
      color: #334155;
      font-size: 20px;
      font-family: inherit;
      background: transparent;
      transition: border-color 0.15s, color 0.15s;
    }
    #add-btn:hover { border-color: #334155; color: #64748b; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #14532d;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div id="header">
    <h1>Command Clipboard</h1>
    <button id="link-btn">Link file</button>
  </div>
  <div id="clips"></div>
  <button id="add-btn">+</button>
  <div class="toast" id="toast">Copied</div>

  <script>
    const STORE_KEY = 'command_clipboard_v1';

    let fileHandle = null;

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch { return []; }
    }

    function save(clips) {
      localStorage.setItem(STORE_KEY, JSON.stringify(clips));
      if (fileHandle) writeToFile(clips);
    }

    async function writeToFile(clips) {
      try {
        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(clips, null, 2));
        await writable.close();
      } catch (e) {
        // file write failed (e.g. permission revoked) — silently fall back to localStorage
        console.warn('File write failed:', e);
      }
    }

    function setLinked(name) {
      const btn = document.getElementById('link-btn');
      btn.textContent = '● ' + name;
      btn.classList.add('linked');
    }

    document.getElementById('link-btn').addEventListener('click', async () => {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'command_clipboard.json',
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
        });
        // Try to read existing data from file
        const file = await handle.getFile();
        const text = await file.text();
        if (text.trim()) {
          try {
            const parsed = JSON.parse(text);
            if (Array.isArray(parsed) && parsed.length > 0) {
              clips = parsed;
              save(clips);
              render();
            }
          } catch { /* ignore invalid JSON, keep current clips */ }
        }
        fileHandle = handle;
        setLinked(handle.name);
        // Write current state immediately
        writeToFile(clips);
      } catch (e) {
        if (e.name !== 'AbortError') console.warn('File picker error:', e);
      }
    });

    let clips = load();
    if (clips.length === 0) clips = [{ id: uid(), title: '', text: '' }];

    function uid() { return Math.random().toString(36).slice(2, 10); }

    // ── Bash tokenizer ────────────────────────────────────────────────────────

    const KEYWORDS = new Set([
      'if','then','else','elif','fi','for','do','done','while','until',
      'case','esac','in','function','return','exit','break','continue',
      'local','export','source','unset','shift','trap','eval','exec',
      'read','declare','typeset','readonly','select','time','coproc',
    ]);

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function span(cls, s) { return `<span class="${cls}">${esc(s)}</span>`; }

    function highlightBash(text) {
      let html = '';
      let i = 0;
      const n = text.length;
      // track whether we expect a command name next
      let expectCmd = true;

      while (i < n) {
        const ch = text[i];

        // newline
        if (ch === '\n') { html += '\n'; i++; expectCmd = true; continue; }

        // whitespace run
        if (ch === ' ' || ch === '\t') {
          let j = i;
          while (j < n && (text[j] === ' ' || text[j] === '\t')) j++;
          html += esc(text.slice(i, j));
          i = j;
          continue;
        }

        // comment
        if (ch === '#') {
          let j = i;
          while (j < n && text[j] !== '\n') j++;
          html += span('h-cmt', text.slice(i, j));
          i = j;
          continue;
        }

        // single-quoted string
        if (ch === "'") {
          let j = i + 1;
          while (j < n && text[j] !== "'") j++;
          html += span('h-str', text.slice(i, j + 1));
          i = j + 1;
          expectCmd = false;
          continue;
        }

        // double-quoted string
        if (ch === '"') {
          let j = i + 1;
          while (j < n && text[j] !== '"') {
            if (text[j] === '\\') j++;
            j++;
          }
          html += span('h-str', text.slice(i, j + 1));
          i = j + 1;
          expectCmd = false;
          continue;
        }

        // backtick subshell
        if (ch === '`') {
          let j = i + 1;
          while (j < n && text[j] !== '`') {
            if (text[j] === '\\') j++;
            j++;
          }
          html += span('h-op', '`') + highlightBash(text.slice(i + 1, j)) + span('h-op', '`');
          i = j + 1;
          expectCmd = true;
          continue;
        }

        // $( ) or ${ } or $var
        if (ch === '$') {
          if (text[i + 1] === '(') {
            // command substitution $(...)
            let depth = 1, j = i + 2;
            while (j < n && depth > 0) {
              if (text[j] === '(') depth++;
              else if (text[j] === ')') depth--;
              j++;
            }
            html += span('h-op','$(') + highlightBash(text.slice(i+2, j-1)) + span('h-op',')');
            i = j;
            expectCmd = false;
            continue;
          }
          if (text[i + 1] === '{') {
            let j = i + 2;
            while (j < n && text[j] !== '}') j++;
            html += span('h-var', text.slice(i, j + 1));
            i = j + 1;
            expectCmd = false;
            continue;
          }
          // $VAR
          let j = i + 1;
          while (j < n && /[\w]/.test(text[j])) j++;
          html += span('h-var', text.slice(i, j));
          i = j;
          expectCmd = false;
          continue;
        }

        // operators: | || & && ; ;; > >> < << ( ) { }
        if ('|&;<>(){}[]'.includes(ch)) {
          let op = ch;
          if ((ch === '|' || ch === '&' || ch === '>' || ch === '<' || ch === ';') &&
              text[i+1] === ch) {
            op = ch + ch; i++;
          } else if (ch === '>' && text[i+1] === '&') {
            op = '>&'; i++;
          } else if (ch === '<' && text[i+1] === '(') {
            // process substitution <(...)
            let depth = 1, j = i + 2;
            while (j < n && depth > 0) {
              if (text[j] === '(') depth++;
              else if (text[j] === ')') depth--;
              j++;
            }
            html += span('h-op','<(') + highlightBash(text.slice(i+2, j-1)) + span('h-op',')');
            i = j;
            expectCmd = true;
            continue;
          }
          html += span('h-op', op);
          i++;
          if ('|&;'.includes(ch)) expectCmd = true;
          continue;
        }

        // word token
        let j = i;
        while (j < n && !/[\s|&;<>(){}[\]`"'$#]/.test(text[j])) j++;
        if (j === i) { html += esc(ch); i++; continue; }

        const word = text.slice(i, j);
        i = j;

        if (word.startsWith('-')) {
          // flag
          html += span('h-flag', word);
        } else if (KEYWORDS.has(word)) {
          html += span('h-key', word);
          // after then/do/else/elif a command follows
          if (['then','do','else','elif'].includes(word)) expectCmd = true;
          else expectCmd = false;
        } else if (expectCmd) {
          html += span('h-cmd', word);
          expectCmd = false;
        } else if (/^\d+$/.test(word)) {
          html += span('h-num', word);
        } else {
          html += span('h-plain', word);
        }
      }

      return html;
    }

    // ── DOM helpers ────────────────────────────────────────────────────────────

    function autoResize(textarea, highlight) {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
      highlight.style.height = textarea.style.height;
    }

    let toastTimer;
    function showToast(label) {
      const t = document.getElementById('toast');
      t.textContent = label ? `Copied: ${label}` : 'Copied';
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
    }

    function render() {
      const container = document.getElementById('clips');
      container.innerHTML = '';

      clips.forEach((clip) => {
        const el = document.createElement('div');
        el.className = 'clip';
        el.dataset.id = clip.id;

        // Left column
        const left = document.createElement('div');
        left.className = 'clip-left';

        // Title
        const title = document.createElement('input');
        title.className = 'clip-title';
        title.type = 'text';
        title.placeholder = 'Title';
        title.value = clip.title;
        title.spellcheck = false;
        title.autocomplete = 'off';
        title.addEventListener('input', () => { clip.title = title.value; save(clips); });

        // Editor wrapper (highlight + textarea stacked)
        const editorWrap = document.createElement('div');
        editorWrap.className = 'clip-editor';

        const highlight = document.createElement('div');
        highlight.className = 'clip-highlight';
        highlight.setAttribute('aria-hidden', 'true');

        const textarea = document.createElement('textarea');
        textarea.className = 'clip-text';
        textarea.rows = 1;
        textarea.placeholder = 'paste command…';
        textarea.value = clip.text;
        textarea.spellcheck = false;
        textarea.autocomplete = 'off';
        textarea.autocorrect = 'off';
        textarea.autocapitalize = 'off';

        function update() {
          clip.text = textarea.value;
          save(clips);
          highlight.innerHTML = highlightBash(textarea.value) || '';
          autoResize(textarea, highlight);
        }

        textarea.addEventListener('input', update);
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            const s = textarea.selectionStart;
            const e2 = textarea.selectionEnd;
            textarea.value = textarea.value.slice(0, s) + '\t' + textarea.value.slice(e2);
            textarea.selectionStart = textarea.selectionEnd = s + 1;
            update();
          }
        });

        editorWrap.appendChild(highlight);
        editorWrap.appendChild(textarea);

        left.appendChild(title);
        left.appendChild(editorWrap);

        // Copy button
        const copyBtn = document.createElement('div');
        copyBtn.className = 'clip-copy';
        copyBtn.title = 'Copy to clipboard';
        copyBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        copyBtn.addEventListener('click', () => {
          if (!clip.text) return;
          navigator.clipboard.writeText(clip.text).then(() => {
            copyBtn.classList.add('copied');
            showToast(clip.title);
            setTimeout(() => copyBtn.classList.remove('copied'), 1000);
          });
        });

        // Delete button
        const delBtn = document.createElement('div');
        delBtn.className = 'clip-delete';
        delBtn.title = 'Remove';
        delBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
        delBtn.addEventListener('click', () => {
          clips = clips.filter(c => c.id !== clip.id);
          if (clips.length === 0) clips = [{ id: uid(), title: '', text: '' }];
          save(clips);
          render();
        });

        el.appendChild(copyBtn);
        el.appendChild(left);
        el.appendChild(delBtn);
        container.appendChild(el);

        // Init highlight and size
        highlight.innerHTML = highlightBash(clip.text) || '';
        autoResize(textarea, highlight);
      });
    }

    document.getElementById('add-btn').addEventListener('click', () => {
      clips.push({ id: uid(), title: '', text: '' });
      save(clips);
      render();
      document.querySelectorAll('.clip-title')[clips.length - 1].focus();
    });

    render();
  </script>
</body>
</html>
